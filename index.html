<!-- 자산 경로는 마운트 경로를 포함한 절대경로로 박는다.
     이 앱은 kyulolong.com/wave-sound 에 얹히는데, 브라우저는 상대경로를
     '문서 주소' 기준으로 푼다. 끝 슬래시가 없는 /wave-sound 에서 manifest.webmanifest 는
     /manifest.webmanifest 가 되어 홈페이지에서 404 난다.
     (manifest 안의 아이콘 경로는 manifest 자기 주소 기준이라 상대경로 그대로 둬도 된다) -->
<link rel="manifest" href="/wave-sound/manifest.webmanifest">
<link rel="apple-touch-icon" href="/wave-sound/icon-180.png">
<link rel="icon" href="/wave-sound/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&display=swap" rel="stylesheet">
<style>
:root{
  --text:#e3ecf4; --muted:rgba(227,236,244,.55); --faint:rgba(227,236,244,.32);
  --chip-bg:rgba(255,255,255,.07); --chip-bd:rgba(255,255,255,.22);
  --accent:#9fcde2;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Gowun Batang',"Apple SD Gothic Neo","Noto Serif KR",serif;
  color:var(--text); overflow-x:hidden;
  background:linear-gradient(180deg,#070d1d 0%,#0c1730 42%,#142440 76%,#1a2f4a 100%);
  background-attachment:fixed;
  transition:background 2s;
}
body.m-morning{background:linear-gradient(180deg,#20334f 0%,#41608a 48%,#8ea6c0 80%,#d8b896 100%);background-attachment:fixed}
body.m-day{background:linear-gradient(180deg,#39618c 0%,#5d86ad 55%,#9dbcd4 100%);background-attachment:fixed}
body.m-evening{background:linear-gradient(180deg,#131a38 0%,#2c2a52 48%,#5e4468 78%,#a06a7e 100%);background-attachment:fixed}
#sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#dfe9f2;animation:tw 4s ease-in-out infinite}
body.m-morning .star,body.m-day .star{display:none}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}
#celes{
  position:fixed;top:9%;right:11%;width:58px;height:58px;border-radius:50%;
  background:#e9e5d8;box-shadow:0 0 46px 8px rgba(233,229,216,.32);
  /* main(z-index:2)이 좁은 화면에서 달 영역을 덮어 탭을 가로채므로 그 위로 올린다 */
  cursor:pointer;z-index:3;transition:background 2s,box-shadow 2s;
  animation:float 14s ease-in-out infinite;
}
body.m-morning #celes,body.m-day #celes{background:#f6dca6;box-shadow:0 0 60px 14px rgba(246,220,166,.4)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@media (max-width:480px){
  #celes{width:46px;height:46px;top:max(3.5%,calc(env(safe-area-inset-top,0px) + 10px));right:5.5%}
}
.sea{position:fixed;left:0;bottom:0;width:200%;background-repeat:repeat-x;pointer-events:none;z-index:0}
.w1{height:120px;opacity:.85;background-size:640px 120px;animation:drift 34s linear infinite;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="640" height="120"><path d="M0 46 Q80 18 160 46 T320 46 T480 46 T640 46 V120 H0 Z" fill="%230d1b2e"/></svg>')}
.w2{height:78px;opacity:.6;background-size:520px 78px;animation:drift 22s linear infinite reverse;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="520" height="78"><path d="M0 30 Q65 10 130 30 T260 30 T390 30 T520 30 V78 H0 Z" fill="%2313253a"/></svg>')}
@keyframes drift{to{transform:translateX(-50%)}}
main{position:relative;max-width:430px;margin:0 auto;padding:max(5vh,34px,calc(env(safe-area-inset-top,0px) + 24px)) 22px 130px;z-index:2}

/* 브랜드 마크와 서명 — ~/.claude/DESIGN.md §7
 *
 * 이 앱은 밤바다에 커밋한다. 누락이 아니라 선택이다(§11): 여기서는 어둠이 크롬이
 * 아니라 내용이다. 흰 종이로 뒤집으면 "쉼"이 아니라 그냥 사운드 믹서가 된다.
 *
 * 그래서 이 앱의 형광 한 점은 버튼이 아니라 브랜드 점 하나다. 재생 버튼은
 * 일부러 형광으로 만들지 않았다 — 쉬라고 만든 화면에서 제일 밝은 게 "눌러"라고
 * 소리치면 안 된다. 어두운 바탕이라 점은 --acid 를 그대로 쓴다(14.7:1).
 */
.brandline{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);letter-spacing:.02em;margin-bottom:14px}
.brandline .dot{width:9px;height:9px;border-radius:50%;background:#8fff00;flex:none}

#dateline{font-size:13px;color:var(--muted);letter-spacing:.02em}
h1{font-size:23px;font-weight:400;line-height:1.5;margin:10px 0 26px}
#play{

  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);
  color:var(--text);transition:transform .2s,background .3s;
}
#play:active{transform:scale(.94)}
#play.on{background:rgba(255,255,255,.22)}
#play svg{width:26px;height:26px;fill:currentColor}
/* SVG에는 hidden 프로퍼티가 없어서 아이콘 전환은 .on 클래스로 */
#play #icPause,#play.on #icPlay{display:none}
#play.on #icPause{display:block}
#playHint{text-align:center;font-size:12px;color:var(--faint);margin-bottom:24px}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;font-family:inherit;font-size:13px;color:var(--text);
  background:var(--chip-bg);border:1px solid var(--chip-bd);border-radius:999px;
  padding:7px 14px;cursor:pointer;transition:background .25s,color .25s;
}
.chip.on{background:rgba(235,242,248,.9);color:#16283e;border-color:transparent}
section#mixer{margin:20px 0 6px}
.grp{font-size:12px;color:var(--faint);margin:18px 0 6px;letter-spacing:.08em}
.row{display:flex;align-items:center;gap:12px;padding:7px 0}
.row .emo{width:24px;text-align:center;font-size:16px;filter:saturate(.75) brightness(1.05)}
.row .nm{width:64px;font-size:14px;color:var(--text)}
.row input[type=range]{flex:1;height:22px;accent-color:var(--accent);background:transparent}
#timerRow{margin-top:22px;align-items:center}
#timerLabel{font-size:12px;color:var(--faint);margin-right:2px;flex:0 0 auto}
#count{font-size:12px;color:var(--muted);margin-left:4px;flex:0 0 auto}
#bottomRow{margin-top:14px}
#foot{margin-top:34px;font-size:11.5px;line-height:1.9;color:var(--faint);text-align:center}
.overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
#breath{background:rgba(5,9,18,.55);backdrop-filter:blur(3px)}
#bCircle{
  width:170px;height:170px;border-radius:50%;
  border:1.5px solid rgba(235,242,248,.65);background:rgba(235,242,248,.06);
  transform:scale(.62);transition:transform 4s cubic-bezier(.4,0,.4,1);
}
#bCircle.in{transform:scale(1);transition-duration:4s}
#bCircle.out{transform:scale(.62);transition-duration:6s}
#bText{font-size:15px;color:var(--text);letter-spacing:.14em}
#bClose{position:absolute;bottom:44px;font-size:12px;color:var(--muted);background:none;border:none;font-family:inherit;cursor:pointer;padding:10px}
#dim{background:#000;opacity:0;transition:opacity 1.2s;cursor:pointer}

#dim p{font-size:12px;color:rgba(255,255,255,.25);transition:opacity 2s}
#letter{background:rgba(5,9,18,.72);backdrop-filter:blur(4px);padding:26px}
.paper{
  max-width:340px;background:#f4efe4;color:#3a352c;border-radius:4px;
  padding:34px 30px;box-shadow:0 18px 60px rgba(0,0,0,.5);

.paper button{

  background:none;border:none;border-bottom:1px solid #c9c2b2;cursor:pointer;padding:2px 0;

#giftRow{display:flex;justify-content:center;margin-top:30px}
#gift{background:rgba(5,9,18,.78);backdrop-filter:blur(5px);overflow-y:auto;justify-content:flex-start}
.gpanel{

}
.gtitle{font-size:17px;margin-bottom:14px}
.glabel{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px}
.gopt{color:var(--faint);font-size:11.5px}

}
.gpanel textarea{resize:vertical;line-height:1.8}

.gcheck{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin:14px 0 18px;cursor:pointer}
.gcheck input{accent-color:var(--accent)}
.gmain{width:100%;text-align:center;font-size:14px;padding:11px 0}
#gResult{margin-top:16px}
#gOut{font-size:11px;color:var(--muted)}
.gbtns{display:flex;gap:8px;margin-top:10px;justify-content:center}
.ghint{font-size:11.5px;color:var(--faint);margin-top:8px;text-align:center}
#gClose{display:block;margin:18px auto 0;background:none;border:none;color:var(--faint);font-family:inherit;font-size:12px;cursor:pointer;padding:6px}
[hidden]{display:none !important}
</style>
</head>
<body>

<main>
  <p class="brandline"><span class="dot" aria-hidden="true"></span>쉼, 바다</p>

  <h1 id="greet"></h1>

  <div id="bCircle"></div>

    <textarea id="gLetter" rows="6" maxlength="4000" placeholder="받는 분만 볼 수 있는 비밀 편지예요."></textarea>

<script>
/* ===== 선물 링크: 이름·편지·믹스가 URL 해시(#g=…) 안에만 담겨요. 서버 저장 없음 ===== */
const GIFT = { n:'', l:'', b:'', m:null };
let giftRaw = '';

function bytesToB64u(bytes){
  let s='';
  for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64uToBytes(s){
  const b=atob(s.replace(/-/g,'+').replace(/_/g,'/'));
  const u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  return u;
}
async function packGift(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  /* 짧은 편지는 압축하지 않는다 — 받는 사람 브라우저에 DecompressionStream이 없어도 열리도록 */
  if(raw.length<=1200) return '0.'+bytesToB64u(raw);
  try{
    const st=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return '1.'+bytesToB64u(new Uint8Array(await new Response(st).arrayBuffer()));
  }catch(e){ return '0.'+bytesToB64u(raw); }
}
async function unpackGift(s){
  const dot=s.indexOf('.');
  const mode=s.slice(0,dot);
  let bytes=b64uToBytes(s.slice(dot+1));
  if(mode==='1'){
    const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    bytes=new Uint8Array(await new Response(st).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function initGift(){
  const m=location.hash.match(/g=([^&]+)/);
  if(!m) return;
  giftRaw=m[1];
  try{
    const o=await unpackGift(giftRaw);
    GIFT.n=String(o.n||'').slice(0,24);
    GIFT.l=String(o.l||'').slice(0,4000);
    GIFT.b=String(o.b||'').slice(0,20);
    GIFT.m=(o.m&&typeof o.m==='object')?o.m:null;
  }catch(e){ giftRaw=''; GIFT.err=true; }
}

const $ = s => document.querySelector(s);

const SOUNDS = [
  {id:'waves',   nm:'파도',     emo:'🌊', scale:1.0,  build:buildWaves},
  {id:'gull',    nm:'갈매기',   emo:'🐚', scale:0.5,  build:buildGull},
  {id:'wind',    nm:'바람',     emo:'💨', scale:0.75, build:buildWind},
  {id:'lark',    nm:'종달새',   emo:'🐦', scale:0.5,  build:buildLark},
  {id:'birds',   nm:'아침 새',  emo:'🐤', scale:0.5,  build:buildBirds},
  {id:'rain',    nm:'비',       emo:'🌧️', scale:0.85, build:buildRain},
  {id:'thunder', nm:'먼 천둥',  emo:'🌩️', scale:0.9,  build:buildThunder},
  {id:'stream',  nm:'시냇물',   emo:'💧', scale:0.8,  build:buildStream},
  {id:'crickets',nm:'귀뚜라미', emo:'🦗', scale:0.4,  build:buildCrickets},
  {id:'fire',    nm:'모닥불',   emo:'🔥', scale:0.9,  build:buildFire},
  {id:'chimes',  nm:'풍경',     emo:'🎐', scale:0.55, build:buildChimes},
  {id:'bowl',    nm:'싱잉볼',   emo:'🔔', scale:0.7,  build:buildBowl},
];
const GROUPS = [
  {t:'바 닷 가', ids:['waves','gull','wind']},
  {t:'새 소 리', ids:['lark','birds']},
  {t:'비 와 물', ids:['rain','thunder','stream']},
  {t:'밤 과 불', ids:['crickets','fire']},
  {t:'울 림',    ids:['chimes','bowl']},
];
const PRESETS = [
  {nm:'아침 바다',   mix:{waves:65, lark:45, gull:16, wind:12}},
  {nm:'밤바다',      mix:{waves:58, wind:16, crickets:12, bowl:6}},
  {nm:'숲속 아침',   mix:{stream:50, birds:46, wind:14, lark:10}},
  {nm:'비 오는 오후',mix:{rain:58, thunder:22, fire:26, wind:8}},
  {nm:'여름 밤',     mix:{crickets:44, chimes:22, wind:12, waves:10}},
  {nm:'깊은 쉼',     mix:{bowl:46, wind:10, chimes:14}},
];
/* p = 너울이 한 번 밀려오는 주기(초). 지중해는 짧고 잘게, 대서양은 길고 크게 */
const BEACHES = [
  /* 동해 */
  {n:'강릉 경포', p:9},{n:'강릉 안목', p:9},{n:'속초 외옹치', p:10},{n:'고성 봉포', p:10},
  {n:'양양 죽도', p:8},{n:'양양 하조대', p:9},{n:'삼척 맹방', p:10},{n:'동해 망상', p:10},
  {n:'울진 망양', p:8},{n:'영덕 고래불', p:9},{n:'포항 월포', p:10},
  /* 남해 · 서해 */
  {n:'부산 해운대', p:9},{n:'부산 송정', p:8},{n:'거제 학동', p:11},{n:'통영 비진도', p:12},
  {n:'남해 상주', p:12},{n:'여수 만성리', p:10},{n:'완도 명사십리', p:9},{n:'신안 증도', p:12},
  {n:'보령 대천', p:11},{n:'태안 꽃지', p:11},{n:'인천 을왕리', p:11},

  {n:'니스 프롬나드', p:7},{n:'산토리니 카마리', p:6},{n:'포지타노', p:6},{n:'즈라트니 라트', p:6},

const state = { vols:{}, playing:false, breath:false, timerMin:0, timerEnd:0 };

let AC=null, master, fadeGain, comp, analyser, convolver;
const L={}, built={};
let bufWhite, bufBrown, bufPink, bufBurst;

/* ---------- 오늘의 바다 ----------
   날짜가 씨앗이라 같은 날엔 누가 열어도 같은 바다가 뜬다.
   목록을 한 바퀴 도는 동안에는 같은 바다가 두 번 나오지 않는다. */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function dayNo(d){return Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(1970,0,1))/86400000)}
function shuffled(cycle){
  const a=BEACHES.slice(), rnd=mulberry(cycle+1);
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function orderFor(cycle){
  const a=shuffled(cycle);
  /* 한 바퀴가 끝나고 다음 바퀴 첫날에 같은 바다가 이어지면 한 칸 밀어둔다 */
  if(cycle>0 && a[0].n===shuffled(cycle-1).slice(-1)[0].n) return a.slice(1).concat(a[0]);
  return a;
}
function beachOfDay(n){
  const N=BEACHES.length, cycle=Math.floor(n/N);
  return orderFor(cycle)[n-cycle*N];
}

let today=new Date(), curDay=null, BEACH=BEACHES[0], WAVE_PERIOD=9, previewBeach='';
/* 자정을 넘겨도 켜둔 채로 날짜가 바뀌도록, 1분마다 도는 refreshSky가 이걸 부른다 */
function applyDay(force){
  const now=new Date(), n=dayNo(now);
  if(n===curDay && !force) return;
  curDay=n; today=now;
  const custom = previewBeach || GIFT.b;
  if(custom){
    BEACH={n:custom};
    WAVE_PERIOD=7+(hashStr(custom)%500)/100;   /* 같은 이름이면 늘 같은 파도 */
  }else{
    BEACH=beachOfDay(n);
    WAVE_PERIOD=BEACH.p+mulberry(n)()*2-1;
  }
}
applyDay(true);

/* ---------- 인사말 / 하늘 ---------- */
function hourMode(h){return h<5?'night':h<11?'morning':h<17?'day':h<21?'evening':'night'}
function refreshSky(){
  applyDay();
  const h = new Date().getHours(), m = hourMode(h);
  document.body.className = m==='night' ? '' : 'm-'+m;
  const pre = GIFT.n ? GIFT.n+', ' : '';
  const g = h<5  ? `${pre}깊은 밤이에요. 파도에 맡기고 쉬어요`
        : h<11 ? `${pre}좋은 아침이에요. 종달새가 먼저 와 있어요`
        : h<17 ? `${pre}잠깐 눈을 감아도 괜찮아요`
        : h<21 ? `${pre}오늘 하루도 수고 많았어요`
        :        `${pre}이제 하루를 내려놓아도 돼요`;
  $('#greet').textContent = g;
  const days=['일','월','화','수','목','금','토'];
  /* 직접 적어 보낸 장소면 '오늘의 바다' 수식 없이 그 이름만 */
  const place = (previewBeach||GIFT.b) ? BEACH.n : `오늘의 바다, ${BEACH.n}`;
  $('#dateline').textContent =
    `${today.getMonth()+1}월 ${today.getDate()}일 ${days[today.getDay()]}요일 · ${place}`;
}

function restoreMix(){

/* ================= 소리 엔진 (Web Audio) ================= */
function ensureAudio(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  const sr=AC.sampleRate;
  const mk=(sec,fill)=>{const b=AC.createBuffer(1,Math.floor(sr*sec),sr);fill(b.getChannelData(0));return b};
  bufWhite=mk(4,d=>{for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1});
  bufBrown=mk(6,d=>{let l=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;l=(l+0.02*w)/1.02;d[i]=l*3.5}});
  bufPink=mk(4,d=>{let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<d.length;i++){const w=Math.random()*2-1;
      b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;
      b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}});
  bufBurst=mk(.06,d=>{for(let i=0;i<d.length;i++){const e=1-i/d.length;d[i]=(Math.random()*2-1)*e*e}});

  master=AC.createGain(); fadeGain=AC.createGain();
  comp=AC.createDynamicsCompressor();
  comp.threshold.value=-14; comp.ratio.value=5; comp.knee.value=18;
  analyser=AC.createAnalyser(); analyser.fftSize=2048;
  master.connect(fadeGain); fadeGain.connect(comp); comp.connect(analyser); analyser.connect(AC.destination);

  const impLen=Math.floor(sr*1.8), imp=AC.createBuffer(2,impLen,sr);
  for(let c=0;c<2;c++){const d=imp.getChannelData(c);
    for(let i=0;i<impLen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/impLen,2.6)*.5}
  convolver=AC.createConvolver(); convolver.buffer=imp;
  const revOut=AC.createGain(); revOut.gain.value=.5;
  convolver.connect(revOut); revOut.connect(master);

  window.__sea={ rms(){
    const a=new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(a);
    let s=0;for(let i=0;i<a.length;i++)s+=a[i]*a[i];
    return Math.sqrt(s/a.length);
  }, ac:()=>AC };
}
function mkLayer(rev){
  const g=AC.createGain(); g.gain.value=0; g.connect(master);
  const send=AC.createGain(); send.gain.value=rev||0; g.connect(send); send.connect(convolver);
  return {g,send};
}
const loopSrc=(buf)=>{const s=AC.createBufferSource();s.buffer=buf;s.loop=true;s.start();return s};
const flt=(type,f,q)=>{const x=AC.createBiquadFilter();x.type=type;x.frequency.value=f;if(q)x.Q.value=q;return x};
const gn=v=>{const g=AC.createGain();g.gain.value=v;return g};
const vol=id=>state.vols[id]||0;
const r=(a,b)=>a+Math.random()*(b-a);

function looper(fn){
  let dead=false;
  (function tick(){ if(dead)return; let d=600;
    try{ d = fn() || 600; }catch(e){}
    setTimeout(tick,d);
  })();
  return ()=>{dead=true};
}
function idle(id){ return !state.playing || vol(id)===0 }

function setVol(id,v,slow){
  state.vols[id]=v;
  if(!AC || !state.playing) return;
  if(v>0 && !built[id]) buildSound(id);
  if(!L[id]) return;
  const s=SOUNDS.find(x=>x.id===id);
  L[id].g.gain.setTargetAtTime(Math.pow(v/100,2)*s.scale, AC.currentTime, slow?1.0:0.15);
}
function buildSound(id){
  built[id]=true;
  SOUNDS.find(x=>x.id===id).build();
}

/* ---- 파도 ---- */
let surfG,washG;
function buildWaves(){
  L.waves=mkLayer(.12);
  const bed=loopSrc(bufBrown), bf=flt('lowpass',360), bg=gn(.4);
  bed.connect(bf);bf.connect(bg);bg.connect(L.waves.g);
  const surf=loopSrc(bufBrown), sf=flt('lowpass',720); surfG=gn(.12);
  surf.connect(sf);sf.connect(surfG);surfG.connect(L.waves.g);
  const wash=loopSrc(bufWhite), wf=flt('bandpass',1900,.7); washG=gn(.02);
  wash.connect(wf);wf.connect(washG);washG.connect(L.waves.g);
  looper(()=>{
    if(idle('waves')) return 700;
    if(state.breath) return 700;
    swell();
    return (WAVE_PERIOD + r(-2,2))*1000;
  });
}
function swell(){
  if(!surfG) return;
  const t=AC.currentTime, k=r(.75,1);
  surfG.gain.setTargetAtTime(.85*k,t,.9);
  surfG.gain.setTargetAtTime(.12,t+2.2,1.7);
  washG.gain.setTargetAtTime(.5*k,t+.45,.5);
  washG.gain.setTargetAtTime(.02,t+2.4,1.1);
}

/* ---- 갈매기 ---- */
function buildGull(){
  L.gull=mkLayer(.5);
  const bp=flt('bandpass',950,1.6); bp.connect(L.gull.g);
  function cry(t){
    const o=AC.createOscillator();o.type='sawtooth';
    const g=gn(0); o.connect(g);g.connect(bp);
    const d=r(.45,.85), f0=r(1150,1400);
    o.frequency.setValueAtTime(f0,t);
    o.frequency.linearRampToValueAtTime(f0*.92,t+d*.3);
    o.frequency.linearRampToValueAtTime(r(600,750),t+d);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.5,t+.06);
    g.gain.setValueAtTime(.5,t+d*.7);
    g.gain.linearRampToValueAtTime(0,t+d);
    o.start(t);o.stop(t+d+.05);
  }
  looper(()=>{
    if(idle('gull')) return 800;
    const t=AC.currentTime+.1, n=1+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++) cry(t+i*r(.6,.9));
    return r(8000,24000);
  });
}

/* ---- 바람 ---- */
function buildWind(){
  L.wind=mkLayer(.1);
  const src=loopSrc(bufPink), bp=flt('bandpass',520,.5), gust=gn(.5);
  src.connect(bp);bp.connect(gust);gust.connect(L.wind.g);
  looper(()=>{
    if(idle('wind')) return 900;
    const t=AC.currentTime;
    bp.frequency.setTargetAtTime(r(280,950),t,2.5);
    gust.gain.setTargetAtTime(r(.25,1),t,2.2);
    return r(2500,6000);
  });
}

/* ---- 종달새 ---- */
function buildLark(){
  L.lark=mkLayer(.3);
  const o=AC.createOscillator();o.type='sine';o.start();
  const gate=gn(0), bp=flt('bandpass',3600,.6), pan=AC.createStereoPanner();
  o.connect(gate);gate.connect(bp);bp.connect(pan);pan.connect(L.lark.g);
  let t=0, singUntil=0, pauseUntil=0;
  looper(()=>{
    if(idle('lark')){t=0;return 600}
    const now=AC.currentTime, horizon=now+1.5;
    if(t<now) t=now+.05;
    if(Math.random()<.2) pan.pan.setTargetAtTime(r(-.45,.45),now,3);
    while(t<horizon){
      if(t>=singUntil){
        if(t<pauseUntil){ t=pauseUntil; continue; }
        singUntil=t+r(8,18); pauseUntil=singUntil+r(2.5,6);
      }
      const d=r(.035,.08), f1=r(2500,4700), f2=r(2500,4700);
      o.frequency.setValueAtTime(f1,t);
      o.frequency.linearRampToValueAtTime(f2,t+d);
      const a=r(.4,.9);
      gate.gain.setValueAtTime(0,t);
      gate.gain.linearRampToValueAtTime(a,t+.008);
      gate.gain.linearRampToValueAtTime(0,t+d);
      t+=d + (Math.random()<.13 ? r(.05,.17) : 0);
    }
    return 400;
  });
}

/* ---- 아침 새 ---- */
function buildBirds(){
  L.birds=mkLayer(.4);
  const mk=(panv)=>{
    const o=AC.createOscillator();o.type='sine';o.start();
    const gate=gn(0), pan=AC.createStereoPanner();pan.pan.value=panv;
    o.connect(gate);gate.connect(pan);pan.connect(L.birds.g);
    return {o,gate,next:0};
  };
  const birds=[mk(-.6),mk(.05),mk(.65)];
  looper(()=>{
    if(idle('birds')){birds.forEach(b=>b.next=0);return 700}
    const now=AC.currentTime;
    birds.forEach(b=>{
      if(b.next>now+ .3) return;
      let t=Math.max(now+.05,b.next);
      const notes=2+Math.floor(Math.random()*4);
      for(let i=0;i<notes;i++){
        const d=r(.05,.14), f=r(2100,4300), f2=f*r(.75,1.3);
        b.o.frequency.setValueAtTime(f,t);
        b.o.frequency.linearRampToValueAtTime(f2,t+d);
        const a=r(.35,.8);
        b.gate.gain.setValueAtTime(0,t);
        b.gate.gain.linearRampToValueAtTime(a,t+.01);
        b.gate.gain.linearRampToValueAtTime(0,t+d);
        t+=d+r(.04,.12);
      }
      b.next=t+r(1.5,6.5);
    });
    return 300;
  });
}

/* ---- 비 ---- */
function buildRain(){
  L.rain=mkLayer(.06);
  const bed=loopSrc(bufWhite), hp=flt('highpass',380), lp=flt('lowpass',6200), bg=gn(.5);
  bed.connect(hp);hp.connect(lp);lp.connect(bg);bg.connect(L.rain.g);
  const dropHp=flt('highpass',1400); dropHp.connect(L.rain.g);
  let t=0;
  looper(()=>{
    if(idle('rain')){t=0;return 700}
    const now=AC.currentTime;
    bg.gain.setTargetAtTime(r(.4,.6),now,1.5);
    if(t<now)t=now+.02;
    const horizon=now+1.2;
    while(t<horizon){
      const s=AC.createBufferSource();s.buffer=bufBurst;s.playbackRate.value=r(.8,2.2);
      const g=gn(Math.pow(Math.random(),2)*.4);
      s.connect(g);g.connect(dropHp);
      s.start(t);
      t+=r(.03,.15);
    }
    return 500;
  });
}

/* ---- 먼 천둥 ---- */
function buildThunder(){
  L.thunder=mkLayer(.35);
  const lp=flt('lowpass',110); lp.connect(L.thunder.g);
  function rumble(t,amp,dur){
    const s=AC.createBufferSource();s.buffer=bufBrown;s.loopEnd=6;
    const g=gn(0); s.connect(g);g.connect(lp);
    g.gain.setValueAtTime(0,t);
    g.gain.setTargetAtTime(amp,t,.5);
    g.gain.setTargetAtTime(.0001,t+dur*.35,dur*.3);
    s.start(t,r(0,2),dur+1);
  }
  looper(()=>{
    if(idle('thunder')) return 900;
    const t=AC.currentTime+.1;
    rumble(t,r(.5,.9),r(2.5,4));
    if(Math.random()<.5) rumble(t+r(1.5,2.5),r(.25,.45),r(2,3));
    return r(24000,65000);
  });
}

/* ---- 시냇물 ---- */
function buildStream(){
  L.stream=mkLayer(.08);
  const v1=loopSrc(bufWhite), f1=flt('bandpass',1250,2), g1=gn(.32);
  v1.connect(f1);f1.connect(g1);g1.connect(L.stream.g);
  const v2=loopSrc(bufWhite), f2=flt('bandpass',2400,3), g2=gn(.18);
  v2.connect(f2);f2.connect(g2);g2.connect(L.stream.g);
  let bloopAt=0;
  looper(()=>{
    if(idle('stream')) return 700;
    const now=AC.currentTime;
    f1.frequency.setTargetAtTime(r(950,1600),now,.09);
    f2.frequency.setTargetAtTime(r(2000,2900),now,.07);
    g2.gain.setTargetAtTime(r(.1,.24),now,.2);
    if(now>bloopAt){
      const o=AC.createOscillator();o.type='sine';
      const g=gn(0);o.connect(g);g.connect(L.stream.g);
      const t=now+.05;
      o.frequency.setValueAtTime(r(320,450),t);
      o.frequency.exponentialRampToValueAtTime(r(120,180),t+.07);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.25,t+.012);
      g.gain.linearRampToValueAtTime(0,t+.07);
      o.start(t);o.stop(t+.12);
      bloopAt=now+r(1.2,4.5);
    }
    return 130;
  });
}

/* ---- 귀뚜라미 ---- */
function buildCrickets(){
  L.crickets=mkLayer(.15);
  const lp=flt('lowpass',7000); lp.connect(L.crickets.g);
  const mk=(f,panv)=>{
    const o=AC.createOscillator();o.type='sine';o.frequency.value=f;o.start();
    const gate=gn(0), pan=AC.createStereoPanner();pan.pan.value=panv;
    o.connect(gate);gate.connect(pan);pan.connect(lp);
    return {gate,next:0};
  };
  const cs=[mk(4250,-.55),mk(4480,.1),mk(4700,.6)];
  looper(()=>{
    if(idle('crickets')){cs.forEach(c=>c.next=0);return 700}
    const now=AC.currentTime;
    cs.forEach(c=>{
      if(c.next>now+.3) return;
      let t=Math.max(now+.05,c.next);
      const pulses=3+Math.floor(Math.random()*3);
      for(let i=0;i<pulses;i++){
        c.gate.gain.setValueAtTime(0,t);
        c.gate.gain.linearRampToValueAtTime(r(.3,.5),t+.006);
        c.gate.gain.setValueAtTime(r(.3,.5),t+.022);
        c.gate.gain.linearRampToValueAtTime(0,t+.03);
        t+=.052;
      }
      c.next=t+r(.5,2.1);
    });
    return 300;
  });
}

/* ---- 모닥불 ---- */
function buildFire(){
  L.fire=mkLayer(.05);
  const bed=loopSrc(bufBrown), lp=flt('lowpass',240), bg=gn(.5);
  bed.connect(lp);lp.connect(bg);bg.connect(L.fire.g);
  const crHp=flt('highpass',2100); crHp.connect(L.fire.g);
  let t=0, popAt=0;
  looper(()=>{
    if(idle('fire')){t=0;return 700}
    const now=AC.currentTime;
    if(t<now)t=now+.02;
    const horizon=now+1.2;
    while(t<horizon){
      const s=AC.createBufferSource();s.buffer=bufBurst;s.playbackRate.value=r(1.4,3.2);
      const g=gn(Math.pow(Math.random(),2.2)*.55);
      s.connect(g);g.connect(crHp);
      s.start(t);
      t+=r(.05,.4);
    }
    if(now>popAt){
      const o=AC.createOscillator();o.type='sine';
      const g=gn(0);o.connect(g);g.connect(L.fire.g);
      const pt=now+.05;
      o.frequency.setValueAtTime(r(85,120),pt);
      o.frequency.exponentialRampToValueAtTime(55,pt+.09);
      g.gain.setValueAtTime(0,pt);
      g.gain.linearRampToValueAtTime(.35,pt+.008);
      g.gain.linearRampToValueAtTime(0,pt+.1);
      o.start(pt);o.stop(pt+.15);
      popAt=now+r(2,9);
    }
    return 500;
  });
}

/* ---- 풍경 ---- */
function buildChimes(){
  L.chimes=mkLayer(.6);
  const NOTES=[587.33,659.25,783.99,880,1046.5,1174.66];
  function strike(t){
    const f=NOTES[Math.floor(Math.random()*NOTES.length)];
    [[f,1],[f*2.76,.16]].forEach(([ff,amp])=>{
      const o=AC.createOscillator();o.type='sine';o.frequency.value=ff;
      const g=gn(0);o.connect(g);g.connect(L.chimes.g);
      const peak=amp*r(.18,.45);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(peak,t+.006);
      g.gain.setTargetAtTime(.0001,t+.01,1.3);
      o.start(t);o.stop(t+7);
    });
  }
  looper(()=>{
    if(idle('chimes')) return 800;
    const t=AC.currentTime+.1, n=1+Math.floor(Math.random()*3);
    let tt=t;
    for(let i=0;i<n;i++){ strike(tt); tt+=r(.14,.7); }
    return r(2600,10000);
  });
}

/* ---- 싱잉볼 ---- */
let bowlSwell;
function buildBowl(){
  L.bowl=mkLayer(.5);
  const lp=flt('lowpass',900); bowlSwell=gn(.7);
  bowlSwell.connect(lp); lp.connect(L.bowl.g);
  [[136.1,.2],[136.55,.2],[394.7,.05],[395.3,.05]].forEach(([f,a])=>{
    const o=AC.createOscillator();o.type='sine';o.frequency.value=f;o.start();
    const g=gn(a);o.connect(g);g.connect(bowlSwell);
  });
  looper(()=>{
    if(idle('bowl')) return 900;
    const t=AC.currentTime;
    bowlSwell.gain.setTargetAtTime(1.05,t,1.5);
    bowlSwell.gain.setTargetAtTime(.7,t+6,4);
    return r(35000,65000);
  });
}

/* ---------- 재생 / 정지 ---------- */
/* iOS는 Web Audio만 쓰는 페이지를 'ambient' 오디오 세션으로 잡아서, 옆면 무음 스위치가
   켜져 있으면 통째로 음소거하고 볼륨도 미디어가 아닌 벨소리를 따라간다.
   무음 트랙을 함께 재생하면 'playback' 세션으로 바뀌어 스위치를 무시한다. */
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent)
           || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
let silence=null;
function ensureSilence(){
  if(silence) return silence;
  const sr=8000, n=sr/2, b=new Uint8Array(44+n), dv=new DataView(b.buffer);
  const put=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i)};
  put(0,'RIFF'); dv.setUint32(4,36+n,true); put(8,'WAVEfmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true); dv.setUint32(28,sr,true);
  dv.setUint16(32,1,true); dv.setUint16(34,8,true);
  put(36,'data'); dv.setUint32(40,n,true);
  b.fill(0x80,44);                       /* 8비트 무부호 PCM에서 0x80이 무음 */
  silence=new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'})));
  silence.loop=true; silence.setAttribute('playsinline',''); silence.volume=1;
  return silence;
}

let wakeLock=null;
async function keepAwake(on){
  try{
    if(on){ wakeLock = await navigator.wakeLock?.request('screen'); }
    else { await wakeLock?.release(); wakeLock=null; }
  }catch(e){}
}
/* 전화·시리 같은 인터럽트나 백그라운드 전환 뒤엔 iOS가 컨텍스트를 멈춰둔다 */
function nudgeAudio(){
  if(!state.playing) return;
  AC?.resume().catch(()=>{});
  silence?.play().catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && state.playing){ keepAwake(true); nudgeAudio(); }
});

const playBtn=$('#play');
playBtn.onclick=async()=>{
  ensureAudio();
  if(!state.playing){
    /* 반드시 탭 제스처 안에서, await 앞에 걸어야 iOS가 재생을 허락한다 */
    ensureSilence().play().catch(()=>{});
    AC.onstatechange=()=>{ if(AC.state!=='running') nudgeAudio(); };
    await AC.resume();
    cancelFade();
    state.playing=true;
    SOUNDS.forEach(s=>{ if(vol(s.id)>0) setVol(s.id,vol(s.id),true); });
    if(state.timerMin) state.timerEnd=Date.now()+state.timerMin*60000;
    keepAwake(true);
  }else{
    state.playing=false;
    silence?.pause();
    await AC.suspend();
    keepAwake(false);
  }
  playBtn.classList.toggle('on',state.playing);
  playBtn.setAttribute('aria-label',state.playing?'일시정지':'재생');
  $('#playHint').textContent = state.playing ? '이제 눈을 감아도 돼요' : '눌러서 바다를 켜요';
  /* 무음 트랙으로도 안 되는 경우가 있어(벨소리 볼륨 0 등) 처음 한 번만 살짝 일러둔다 */
  if(isIOS && state.playing && !sessionStorage.getItem('sea.iosHint')){
    sessionStorage.setItem('sea.iosHint','1');
    $('#playHint').textContent='소리가 안 들리면 옆면 무음 스위치와 볼륨을 확인해요';
    setTimeout(()=>{ if(state.playing) $('#playHint').textContent='이제 눈을 감아도 돼요' },7000);
  }
};

/* 무음 트랙 때문에 잠금화면에 재생 위젯이 뜬다. 거기서 누른 것도 버튼과 같이 움직이게 */
if('mediaSession' in navigator){
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:'쉼, 바다',artist:'파도와 종달새'});
    const sync=()=>{ playBtn.click(); };
    navigator.mediaSession.setActionHandler('play',sync);
    navigator.mediaSession.setActionHandler('pause',sync);
  }catch(e){}
}

let fading=false;
function startFade(){
  if(fading||!AC) return;
  fading=true;
  fadeGain.gain.setTargetAtTime(.0001,AC.currentTime,25);
  setTimeout(async()=>{
    if(!fading) return;
    state.playing=false; state.timerEnd=0; fading=false;
    silence?.pause();
    await AC.suspend();
    fadeGain.gain.cancelScheduledValues(AC.currentTime);
    fadeGain.gain.value=1;
    keepAwake(false);
    playBtn.classList.remove('on');
    playBtn.setAttribute('aria-label','재생');
    $('#playHint').textContent='좋은 꿈 꿔요';
  },80000);
}
function cancelFade(){
  if(!AC) return;
  fading=false;
  fadeGain.gain.cancelScheduledValues(AC.currentTime);
  fadeGain.gain.setTargetAtTime(1,AC.currentTime,.5);
}

/* ---------- 호흡 가이드 ---------- */
const breathEl=$('#breath'), bCircle=$('#bCircle'), bText=$('#bText');
let breathTimer=null;
$('#breathBtn').onclick=()=>{
  state.breath=true;
  breathEl.hidden=false;
  breathCycle();
};
$('#bClose').onclick=()=>{
  state.breath=false;
  breathEl.hidden=true;
  clearTimeout(breathTimer);
  bCircle.classList.remove('in','out');
};
function breathCycle(){
  if(!state.breath) return;
  bText.textContent='들이쉬고';
  bCircle.classList.remove('out');bCircle.classList.add('in');
  if(state.playing && vol('waves')>0) swell();
  breathTimer=setTimeout(()=>{
    if(!state.breath) return;
    bText.textContent='천천히 내쉬고';
    bCircle.classList.remove('in');bCircle.classList.add('out');
    breathTimer=setTimeout(breathCycle,6000);
  },4000);
}

/* ---------- 화면 어둡게 ---------- */
const dim=$('#dim');
$('#dimBtn').onclick=()=>{
  dim.hidden=false;
  requestAnimationFrame(()=>dim.classList.add('show'));
  setTimeout(()=>{dim.querySelector('p').style.opacity=0},3500);
};
dim.onclick=()=>{
  dim.classList.remove('show');
  dim.querySelector('p').style.opacity='';
  setTimeout(()=>{dim.hidden=true},1200);
};

/* ---------- 달을 세 번 두드리면 (편지가 담긴 링크일 때만) ---------- */
let taps=[], letterEl=$('#letter');
$('#celes').onclick=()=>{
  if(!GIFT.l) return;
  const now=Date.now();
  taps=taps.filter(t=>now-t<3000); taps.push(now);
  if(taps.length>=3){ taps=[]; letterEl.hidden=false; }
};
$('#letterClose').onclick=()=>{letterEl.hidden=true};

/* ---------- 이 바다를 선물하기 ---------- */
const giftEl=$('#gift');
$('#giftBtn').onclick=()=>{ giftEl.hidden=false; };
$('#gClose').onclick=()=>{ giftEl.hidden=true; };
/* 적는 대로 맨 위 날짜줄에 바로 비쳐서, 받는 사람 화면을 미리 볼 수 있게 */
$('#gBeach').oninput=()=>{
  previewBeach=$('#gBeach').value.trim().slice(0,20);
  applyDay(true); refreshSky();
};
$('#gMake').onclick=async()=>{
  const o={};
  const n=$('#gName').value.trim().slice(0,24);
  const l=$('#gLetter').value.trim().slice(0,4000);
  const b=$('#gBeach').value.trim().slice(0,20);
  if(n)o.n=n;
  if(l)o.l=l;
  if(b)o.b=b;
  if($('#gMix').checked){
    const m={};
    SOUNDS.forEach(s=>{const v=vol(s.id); if(v>0)m[s.id]=v});
    if(Object.keys(m).length)o.m=m;
  }
  const url=location.origin+location.pathname+'#g='+await packGift(o);
  $('#gOut').value=url;
  $('#gResult').hidden=false;
  $('#gHint').textContent = url.length>2000
    ? '편지가 길어서 링크도 길어요. 카톡이나 메일로 보내는 걸 추천해요.'
    : '링크 하나에 전부 담겼어요. 서버엔 아무것도 저장되지 않아요.';
};
function flash(btn,msg,back){
  btn.textContent=msg;
  clearTimeout(btn._t);
  btn._t=setTimeout(()=>{btn.textContent=back},2200);
}
async function copyLink(url){
  try{ await navigator.clipboard.writeText(url); return true; }
  catch(e){
    try{
      const o=$('#gOut'); o.focus(); o.select(); o.setSelectionRange(0,99999);
      return document.execCommand('copy');
    }catch(e2){ return false; }
  }
}
$('#gCopy').onclick=async()=>{
  const url=$('#gOut').value; if(!url)return;
  const ok=await copyLink(url);
  flash($('#gCopy'), ok?'복사됐어요':'복사 안 됐어요', '복사');
  if(!ok) $('#gHint').textContent='링크를 길게 눌러 직접 복사해 주세요.';
};
$('#gShare').onclick=async()=>{
  const url=$('#gOut').value; if(!url)return;
  const data={title:'쉼, 바다', text:'눈을 감으면 도착하는 바다를 보내요.', url};
  /* 공유 시트를 쓸 수 있으면 그걸로. canShare까지 확인해야 데스크톱에서 헛돌지 않는다 */
  if(navigator.share && (!navigator.canShare || navigator.canShare(data))){
    try{ await navigator.share(data); return; }
    catch(e){ if(e && e.name==='AbortError') return; }   /* 직접 닫은 거면 그대로 둔다 */
  }
  /* 못 열면 조용히 넘어가지 않고, 복사로 대신했다고 알려준다 */
  const ok=await copyLink(url);
  flash($('#gShare'), ok?'링크 복사됨':'복사 안 됐어요', '공유');
  $('#gHint').textContent = ok
    ? '이 기기에선 공유창을 못 열어서 링크를 복사해 뒀어요. 카톡에 붙여넣기 해주세요.'
    : '링크를 길게 눌러 직접 복사해 주세요.';
};

/* ---------- 시작 ---------- */
window.addEventListener('hashchange',()=>location.reload());
initGift().then(()=>{
  applyDay(true);
  refreshSky();
  restoreMix();
  if(GIFT.l){ $('#letterBody').textContent=GIFT.l; $('#footHint').hidden=false; }
  else if(GIFT.err){
    $('#footHint').textContent='링크가 조금 다쳤나 봐요. 보낸 사람에게 다시 받아 볼래요?';
    $('#footHint').hidden=false;
  }
});
